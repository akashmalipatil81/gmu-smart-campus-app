server.port=4000
spring.application.name=gmu-smart-campus
spring.datasource.url=jdbc:h2:file:./data/gmu-campus;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
app.admin.aadhaar=${APP_ADMIN_AADHAAR:}
app.admin.password=${APP_ADMIN_PASSWORD:}
